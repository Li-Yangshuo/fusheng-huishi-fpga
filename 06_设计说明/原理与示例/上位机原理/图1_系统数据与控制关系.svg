<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="1120" viewBox="0 0 1880 1120"><rect width="100%" height="100%" fill="#f7faff"/><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#527aa6"/></marker></defs><text x="940.0" y="84" font-family="Microsoft YaHei, sans-serif" font-size="40" text-anchor="middle" fill="#15324d" font-weight="bold">M7 以太网视频与网页系统</text><text x="940.0" y="130" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" fill="#53667d" font-weight="normal">视频由 FPGA 生成　电脑完成接收与交互　手机复用电脑网页</text><rect x="60" y="190" width="300" height="170" rx="18" fill="#ffffff" stroke="#bdd2e7" stroke-width="3"/><text x="210.0" y="241" font-family="Microsoft YaHei, sans-serif" font-size="31" text-anchor="middle" fill="#173b60" font-weight="bold">摄像头</text><text x="210.0" y="288" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" fill="#263c54" font-weight="normal">图像采集</text><text x="210.0" y="328" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" fill="#263c54" font-weight="normal">输入处理主通路</text><rect x="460" y="190" width="430" height="210" rx="18" fill="#ffffff" stroke="#bdd2e7" stroke-width="3"/><text x="675.0" y="241" font-family="Microsoft YaHei, sans-serif" font-size="31" text-anchor="middle" fill="#173b60" font-weight="bold">FPGA M7</text><text x="675.0" y="288" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" fill="#263c54" font-weight="normal">原画与三风格渲染</text><text x="675.0" y="328" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" fill="#263c54" font-weight="normal">按 frame_id 保持缓存所有权</text><text x="675.0" y="368" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" fill="#263c54" font-weight="normal">成对显示与预览旁路</text><polyline points="360,275 460,275" fill="none" stroke="#527aa6" stroke-width="4" marker-end="url(#arr)"/><rect x="1040" y="190" width="340" height="170" rx="18" fill="#ffffff" stroke="#bdd2e7" stroke-width="3"/><text x="1210.0" y="241" font-family="Microsoft YaHei, sans-serif" font-size="31" text-anchor="middle" fill="#173b60" font-weight="bold">HDMI 显示</text><text x="1210.0" y="288" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" fill="#263c54" font-weight="normal">1280×720 @ 60Hz</text><text x="1210.0" y="328" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" fill="#263c54" font-weight="normal">末端叠加屏幕 OSD</text><polyline points="890,275 1040,275" fill="none" stroke="#527aa6" stroke-width="4" marker-end="url(#arr)"/><rect x="460" y="530" width="430" height="210" rx="18" fill="#ffffff" stroke="#bdd2e7" stroke-width="3"/><text x="675.0" y="581" font-family="Microsoft YaHei, sans-serif" font-size="31" text-anchor="middle" fill="#173b60" font-weight="bold">FPGA 网口发送</text><text x="675.0" y="628" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" fill="#263c54" font-weight="normal">两路 640×360 RGB565</text><text x="675.0" y="668" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" fill="#263c54" font-weight="normal">双行邮箱与逐行 CRC32</text><text x="675.0" y="708" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" fill="#263c54" font-weight="normal">FPGV2 → UDP → RGMII</text><polyline points="675,400 675,530" fill="none" stroke="#527aa6" stroke-width="4" marker-end="url(#arr)"/><text x="800" y="470" font-family="Microsoft YaHei, sans-serif" font-size="24" text-anchor="middle" fill="#436786" font-weight="normal">OSD 之前提取</text><rect x="1020" y="550" width="300" height="170" rx="18" fill="#ffffff" stroke="#bdd2e7" stroke-width="3"/><text x="1170.0" y="601" font-family="Microsoft YaHei, sans-serif" font-size="31" text-anchor="middle" fill="#173b60" font-weight="bold">局域网路由器</text><text x="1170.0" y="648" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" fill="#263c54" font-weight="normal">板卡有线以太网</text><text x="1170.0" y="688" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" fill="#263c54" font-weight="normal">电脑与手机经 Wi-Fi</text><polyline points="890,635 1020,635" fill="none" stroke="#527aa6" stroke-width="4" marker-end="url(#arr)"/><text x="957" y="608" font-family="Microsoft YaHei, sans-serif" font-size="24" text-anchor="middle" fill="#436786" font-weight="normal">视频与状态</text><rect x="1440" y="500" width="370" height="250" rx="18" fill="#ffffff" stroke="#bdd2e7" stroke-width="3"/><text x="1625.0" y="551" font-family="Microsoft YaHei, sans-serif" font-size="31" text-anchor="middle" fill="#173b60" font-weight="bold">电脑 Python 服务</text><text x="1625.0" y="598" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" fill="#263c54" font-weight="normal">UDP 校验与完整帧重组</text><text x="1625.0" y="638" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" fill="#263c54" font-weight="normal">同帧原画与渲染配对</text><text x="1625.0" y="678" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" fill="#263c54" font-weight="normal">离线语音与手势识别</text><text x="1625.0" y="718" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" fill="#263c54" font-weight="normal">HTTP 图像与控制接口</text><polyline points="1320,635 1440,635" fill="none" stroke="#527aa6" stroke-width="4" marker-end="url(#arr)"/><rect x="1440" y="860" width="370" height="170" rx="18" fill="#ffffff" stroke="#bdd2e7" stroke-width="3"/><text x="1625.0" y="911" font-family="Microsoft YaHei, sans-serif" font-size="31" text-anchor="middle" fill="#173b60" font-weight="bold">电脑浏览器</text><text x="1625.0" y="958" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" fill="#263c54" font-weight="normal">raw RGB565 → Canvas</text><text x="1625.0" y="998" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" fill="#263c54" font-weight="normal">对照显示与交互按钮</text><polyline points="1625,750 1625,860" fill="none" stroke="#527aa6" stroke-width="4" marker-end="url(#arr)"/><text x="1730" y="810" font-family="Microsoft YaHei, sans-serif" font-size="24" text-anchor="middle" fill="#436786" font-weight="normal">本机 HTTP</text><rect x="940" y="860" width="370" height="170" rx="18" fill="#ffffff" stroke="#bdd2e7" stroke-width="3"/><text x="1125.0" y="911" font-family="Microsoft YaHei, sans-serif" font-size="31" text-anchor="middle" fill="#173b60" font-weight="bold">安卓手机浏览器</text><text x="1125.0" y="958" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" fill="#263c54" font-weight="normal">同帧双 JPEG → Canvas</text><text x="1125.0" y="998" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" fill="#263c54" font-weight="normal">配对访问与同一控制接口</text><polyline points="1440,710 1380,710 1380,790 1125,790 1125,860" fill="none" stroke="#527aa6" stroke-width="4" marker-end="url(#arr)"/><text x="1220" y="772" font-family="Microsoft YaHei, sans-serif" font-size="24" text-anchor="middle" fill="#436786" font-weight="normal">局域网 HTTP</text><text x="925" y="1085" font-family="Microsoft YaHei, sans-serif" font-size="25" text-anchor="middle" fill="#607287" font-weight="normal">网络设计采样机会为 15 次/秒；实际完整接收帧率需测量。HDMI 刷新率与推理帧率分别统计。</text></svg>