<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="1120" viewBox="0 0 1880 1120"><rect width="100%" height="100%" fill="#f7faff"/><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#527aa6"/></marker></defs><text x="940.0" y="84" font-family="Microsoft YaHei, sans-serif" font-size="40" text-anchor="middle" fill="#15324d" font-weight="bold">统一风格控制与状态回执</text><text x="940.0" y="130" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" fill="#53667d" font-weight="normal">网页按钮  语音口令  横向挥掌　共用一套板端选择协议</text><rect x="80" y="180" width="460" height="180" rx="18" fill="#ffffff" stroke="#bdd2e7" stroke-width="3"/><text x="310.0" y="231" font-family="Microsoft YaHei, sans-serif" font-size="31" text-anchor="middle" fill="#173b60" font-weight="bold">网页按钮</text><text x="310.0" y="278" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" fill="#263c54" font-weight="normal">style = 0 / 1 / 2</text><text x="310.0" y="318" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" fill="#263c54" font-weight="normal">绝对选择波普 水墨 霓虹</text><rect x="710" y="180" width="460" height="180" rx="18" fill="#ffffff" stroke="#bdd2e7" stroke-width="3"/><text x="940.0" y="231" font-family="Microsoft YaHei, sans-serif" font-size="31" text-anchor="middle" fill="#173b60" font-weight="bold">电脑语音识别</text><text x="940.0" y="278" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" fill="#263c54" font-weight="normal">PCM16 → Vosk 离线中文</text><text x="940.0" y="318" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" fill="#263c54" font-weight="normal">匹配口令 切换风格</text><rect x="1340" y="180" width="460" height="180" rx="18" fill="#ffffff" stroke="#bdd2e7" stroke-width="3"/><text x="1570.0" y="231" font-family="Microsoft YaHei, sans-serif" font-size="31" text-anchor="middle" fill="#173b60" font-weight="bold">电脑手势识别</text><text x="1570.0" y="278" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" fill="#263c54" font-weight="normal">原画 → MediaPipe 关键点</text><text x="1570.0" y="318" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" fill="#263c54" font-weight="normal">张开手掌与横向轨迹判定</text><rect x="630" y="470" width="620" height="210" rx="18" fill="#ffffff" stroke="#bdd2e7" stroke-width="3"/><text x="940.0" y="521" font-family="Microsoft YaHei, sans-serif" font-size="31" text-anchor="middle" fill="#173b60" font-weight="bold">BoardControl 统一入口</text><text x="940.0" y="568" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" fill="#263c54" font-weight="normal">下一风格先换算为绝对编号</text><text x="940.0" y="608" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" fill="#263c54" font-weight="normal">非零序列号 + M7CT + CRC32</text><text x="940.0" y="648" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" fill="#263c54" font-weight="normal">等待回执  重试同一命令  防止重复切换</text><polyline points="310,360 310,418 770,418 770,470" fill="none" stroke="#527aa6" stroke-width="4" marker-end="url(#arr)"/><polyline points="940,360 940,470" fill="none" stroke="#527aa6" stroke-width="4" marker-end="url(#arr)"/><polyline points="1570,360 1570,418 1110,418 1110,470" fill="none" stroke="#527aa6" stroke-width="4" marker-end="url(#arr)"/><rect x="80" y="820" width="470" height="190" rx="18" fill="#ffffff" stroke="#bdd2e7" stroke-width="3"/><text x="315.0" y="871" font-family="Microsoft YaHei, sans-serif" font-size="31" text-anchor="middle" fill="#173b60" font-weight="bold">FPGA 接收与选择</text><text x="315.0" y="918" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" fill="#263c54" font-weight="normal">检查广播 来源与多层校验</text><text x="315.0" y="958" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" fill="#263c54" font-weight="normal">远程命令和物理按键统一仲裁</text><text x="315.0" y="998" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" fill="#263c54" font-weight="normal">按序列号处理重复与旧命令</text><polyline points="630,575 315,575 315,820" fill="none" stroke="#527aa6" stroke-width="4" marker-end="url(#arr)"/><text x="340" y="729" font-family="Microsoft YaHei, sans-serif" font-size="24" text-anchor="middle" fill="#436786" font-weight="normal">UDP18501 广播 M7CT</text><rect x="710" y="820" width="460" height="190" rx="18" fill="#ffffff" stroke="#bdd2e7" stroke-width="3"/><text x="940.0" y="871" font-family="Microsoft YaHei, sans-serif" font-size="31" text-anchor="middle" fill="#173b60" font-weight="bold">FPGA 状态 M7ST</text><text x="940.0" y="918" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" fill="#263c54" font-weight="normal">最近应用序列与 selected</text><text x="940.0" y="958" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" fill="#263c54" font-weight="normal">最近完成计算的 committed</text><text x="940.0" y="998" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" fill="#263c54" font-weight="normal">约每 100ms 返回状态</text><polyline points="550,915 710,915" fill="none" stroke="#527aa6" stroke-width="4" marker-end="url(#arr)"/><rect x="1340" y="820" width="460" height="190" rx="18" fill="#ffffff" stroke="#bdd2e7" stroke-width="3"/><text x="1570.0" y="871" font-family="Microsoft YaHei, sans-serif" font-size="31" text-anchor="middle" fill="#173b60" font-weight="bold">PC 确认并更新页面</text><text x="1570.0" y="918" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" fill="#263c54" font-weight="normal">校验 CRC 与来源</text><text x="1570.0" y="958" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" fill="#263c54" font-weight="normal">序列和选择匹配后清 pending</text><text x="1570.0" y="998" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" fill="#263c54" font-weight="normal">收到回执才确认风格选择</text><polyline points="1170,915 1340,915" fill="none" stroke="#527aa6" stroke-width="4" marker-end="url(#arr)"/><text x="1255" y="878" font-family="Microsoft YaHei, sans-serif" font-size="24" text-anchor="middle" fill="#436786" font-weight="normal">UDP18500</text><text x="940" y="1086" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="middle" fill="#607287" font-weight="normal">选择回执仅表示板端接受该选择；新风格图像完成计算与显示仍属于后续阶段。</text></svg>